<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GeoJSON Map Explorer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            height: 100vh;
            color: #333;
        }
        
        #sidebar {
            width: 300px;
            background: white;
            padding: 20px;
            overflow-y: auto;
            box-shadow: 2px 0 10px rgba(0,0,0,0.1);
        }
        
        #mapContainer {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        h1 {
            color: #667eea;
            margin-bottom: 20px;
            font-size: 24px;
        }
        
        .upload-area {
            border: 3px dashed #667eea;
            border-radius: 10px;
            padding: 30px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            background: rgba(255,255,255,0.1);
            margin-bottom: 20px;
        }
        
        .upload-area:hover {
            background: rgba(255,255,255,0.2);
            border-color: #764ba2;
        }
        
        .upload-area input {
            display: none;
        }
        
        canvas {
            border: 3px solid white;
            border-radius: 10px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
            cursor: crosshair;
            background: white;
        }
        
        .info-box {
            background: #f0f4ff;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 15px;
        }
        
        .info-box h3 {
            color: #667eea;
            margin-bottom: 10px;
            font-size: 18px;
        }
        
        .info-item {
            padding: 8px 0;
            border-bottom: 1px solid #ddd;
        }
        
        .info-item:last-child {
            border-bottom: none;
        }
        
        .badge {
            display: inline-block;
            padding: 3px 8px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: bold;
            margin-right: 5px;
        }
        
        .badge-coastal {
            background: #3498db;
            color: white;
        }
        
        .badge-mountain {
            background: #95a5a6;
            color: white;
        }
        
        .badge-city {
            background: #f39c12;
            color: white;
        }
        
        .stats {
            background: white;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 15px;
        }
        
        .stats h3 {
            color: #764ba2;
            margin-bottom: 10px;
        }
        
        .stat-row {
            display: flex;
            justify-content: space-between;
            padding: 5px 0;
            font-size: 14px;
        }
        
        .stat-label {
            color: #666;
        }
        
        .stat-value {
            font-weight: bold;
            color: #667eea;
        }
        
        #controls {
            background: white;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 15px;
        }
        
        button {
            width: 100%;
            padding: 10px;
            margin: 5px 0;
            border: none;
            border-radius: 5px;
            background: #667eea;
            color: white;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s;
        }
        
        button:hover {
            background: #764ba2;
            transform: translateY(-2px);
        }
        
        .highlight {
            background: #fff3cd !important;
            animation: pulse 1s ease-in-out;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }
    </style>
</head>
<body>
    <div id="sidebar">
        <h1>🗺️ </h1>GeoJSON map viewer</h1>

        <div class="stats" id="mapStats">
            <h3>📊 Statistics</h3>
            <div class="stat-row">
                <span class="stat-label">Total Provinces:</span>
                <span class="stat-value" id="totalProvinces">0</span>
            </div>
            <div class="stat-row">
                <span class="stat-label">Cities:</span>
                <span class="stat-value" id="totalCities">0</span>
            </div>
            <div class="stat-row">
                <span class="stat-label">Coastal Provinces:</span>
                <span class="stat-value" id="coastalCount">0</span>
            </div>
            <div class="stat-row">
                <span class="stat-label">Mountain Provinces:</span>
                <span class="stat-value" id="mountainCount">0</span>
            </div>
        </div>
        
        <div id="controls">
            <h3 style="color: #764ba2; margin-bottom: 10px;">🎮 Controls</h3>
            <button onclick="findLargestProvince()">🏆 Largest Province</button>
            <button onclick="findSmallestProvince()">🔍 Smallest Province</button>
            <button onclick="showCoastalProvinces()">🌊 Coastal Provinces</button>
            <button onclick="showMountainProvinces()">⛰️ Mountain Provinces</button>
            <button onclick="resetView()">🔄 Reset</button>
        </div>
        
        <div class="info-box" id="provinceInfo" style="display: none;">
            <h3>📍 Province Information</h3>
            <div id="provinceDetails"></div>
        </div>
    </div>
    
    <div id="mapContainer">
        <div class="upload-area" id="uploadArea" onclick="document.getElementById('fileInput').click()">
            <input type="file" id="fileInput" accept=".geojson,.json" onchange="loadGeoJSON(event)">
            <h2 style="color: white; margin-bottom: 10px;">📁 Drag and drop GeoJSON file here</h2>
            <p style="color: rgba(255,255,255,0.8);">Or click to select a file</p>
        </div>
        <canvas id="mapCanvas" width="1024" height="768" style="display: none;"></canvas>
    </div>

    <script>
        let mapData = null;
        let canvas = null;
        let ctx = null;
        let selectedProvince = null;
        let highlightedProvinces = new Set();

        function loadGeoJSON(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    mapData = JSON.parse(e.target.result);
                    document.getElementById('uploadArea').style.display = 'none';
                    document.getElementById('mapCanvas').style.display = 'block';
                    initializeMap();
                } catch (error) {
                    alert('Error reading file: ' + error.message);
                }
            };
            reader.readAsText(file);
        }

        function initializeMap() {
            canvas = document.getElementById('mapCanvas');
            ctx = canvas.getContext('2d');
            
            updateStats();
            drawMap();
            
            canvas.addEventListener('click', handleMapClick);
            canvas.addEventListener('mousemove', handleMapHover);
        }

        function updateStats() {
            let totalCities = 0;
            let coastalCount = 0;
            let mountainCount = 0;

            mapData.features.forEach(feature => {
                if (feature.properties.has_city) totalCities++;
                if (feature.properties.is_coastal) coastalCount++;
                if (feature.properties.is_mountainous) mountainCount++;
            });

            document.getElementById('totalProvinces').textContent = mapData.features.length;
            document.getElementById('totalCities').textContent = totalCities;
            document.getElementById('coastalCount').textContent = coastalCount;
            document.getElementById('mountainCount').textContent = mountainCount;
        }

        function drawMap() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // draw background (water)
            ctx.fillStyle = '#4682b4';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // draw provinces
            mapData.features.forEach((feature, index) => {
                drawProvince(feature, index);
            });
        }

        function drawProvince(feature, index) {
            const coords = feature.geometry.coordinates[0];
            const props = feature.properties;
            
            ctx.beginPath();
            ctx.moveTo(coords[0][0], coords[0][1]);
            for (let i = 1; i < coords.length; i++) {
                ctx.lineTo(coords[i][0], coords[i][1]);
            }
            ctx.closePath();

            // color by type
            let fillColor = '#3cb371'; // green (plain land)

            if (highlightedProvinces.has(index)) {
                fillColor = '#ffd700'; // gold (highlighted)
            } else if (selectedProvince === index) {
                fillColor = '#ff6b6b'; // red (selected)
            } else if (props.is_mountainous) {
                fillColor = '#8b8b8b'; // gray (mountains)
            } else if (props.is_coastal) {
                fillColor = '#87ceeb'; // light blue (coastal)
            }

            ctx.fillStyle = fillColor;
            ctx.fill();

            // borders
            ctx.strokeStyle = 'white';
            ctx.lineWidth = 2;
            ctx.stroke();

            // draw city
            if (props.city_location) {
                const [cx, cy] = props.city_location;
                ctx.beginPath();
                ctx.arc(cx, cy, 5, 0, Math.PI * 2);
                ctx.fillStyle = '#ffd700';
                ctx.fill();
                ctx.strokeStyle = 'black';
                ctx.lineWidth = 2;
                ctx.stroke();
            }
        }

        function handleMapClick(event) {
            const rect = canvas.getBoundingClientRect();
            const x = event.clientX - rect.left;
            const y = event.clientY - rect.top;

            const provinceIndex = findProvinceAtPoint(x, y);
            if (provinceIndex !== -1) {
                selectedProvince = provinceIndex;
                showProvinceInfo(mapData.features[provinceIndex]);
                drawMap();
            }
        }

        function handleMapHover(event) {
            const rect = canvas.getBoundingClientRect();
            const x = event.clientX - rect.left;
            const y = event.clientY - rect.top;

            const provinceIndex = findProvinceAtPoint(x, y);
            canvas.style.cursor = provinceIndex !== -1 ? 'pointer' : 'crosshair';
        }

        function findProvinceAtPoint(x, y) {
            for (let i = 0; i < mapData.features.length; i++) {
                const coords = mapData.features[i].geometry.coordinates[0];
                if (isPointInPolygon([x, y], coords)) {
                    return i;
                }
            }
            return -1;
        }

        function isPointInPolygon(point, polygon) {
            let inside = false;
            for (let i = 0, j = polygon.length - 1; i < polygon.length; j = i++) {
                const xi = polygon[i][0], yi = polygon[i][1];
                const xj = polygon[j][0], yj = polygon[j][1];
                
                const intersect = ((yi > point[1]) !== (yj > point[1]))
                    && (point[0] < (xj - xi) * (point[1] - yi) / (yj - yi) + xi);
                if (intersect) inside = !inside;
            }
            return inside;
        }

        function showProvinceInfo(feature) {
            const props = feature.properties;
            const infoBox = document.getElementById('provinceInfo');
            const details = document.getElementById('provinceDetails');
            
            let badges = '';
            if (props.is_coastal) badges += '<span class="badge badge-coastal">Coastal</span>';
            if (props.is_mountainous) badges += '<span class="badge badge-mountain">Mountainous</span>';
            if (props.has_city) badges += '<span class="badge badge-city">City</span>';

            details.innerHTML = `
                <div class="info-item">
                    <strong>Province:</strong> #${props.province_id}
                </div>
                <div class="info-item">
                    <strong>City:</strong> ${props.city_name || 'None'}
                </div>
                <div class="info-item">
                    <strong>Area:</strong> ${Math.round(props.area)} px²
                </div>
                <div class="info-item">
                    <strong>Location:</strong> ${props.city_location ? `(${props.city_location[0]}, ${props.city_location[1]})` : 'None'}
                </div>
                <div class="info-item">
                    ${badges}
                </div>
            `;
            
            infoBox.style.display = 'block';
        }

        function findLargestProvince() {
            let largest = null;
            let maxArea = 0;
            let largestIndex = -1;

            mapData.features.forEach((feature, index) => {
                if (feature.properties.area > maxArea) {
                    if(feature.properties.city_name != null) {
                        maxArea = feature.properties.area;
                        largest = feature;
                        largestIndex = index;
                    }
                }
            });

            if (largest) {
                selectedProvince = largestIndex;
                showProvinceInfo(largest);
                drawMap();
                alert(`Largest Province: ${largest.properties.city_name }\nArea: ${Math.round(maxArea)} px²`);
            }
        }

        function findSmallestProvince() {
            let smallest = null;
            let minArea = Infinity;
            let smallestIndex = -1;

            mapData.features.forEach((feature, index) => {
                if (feature.properties.area < minArea) {
                    minArea = feature.properties.area;
                    smallest = feature;
                    smallestIndex = index;
                }
            });

            if (smallest) {
                selectedProvince = smallestIndex;
                showProvinceInfo(smallest);
                drawMap();
                alert(`Smallest Province: ${smallest.properties.city_name || 'None'}\nArea: ${Math.round(minArea)} px²`);
            }
        }

        function showCoastalProvinces() {
            highlightedProvinces.clear();
            mapData.features.forEach((feature, index) => {
                if (feature.properties.is_coastal) {
                    highlightedProvinces.add(index);
                }
            });
            drawMap();
        }

        function showMountainProvinces() {
            highlightedProvinces.clear();
            mapData.features.forEach((feature, index) => {
                if (feature.properties.is_mountainous) {
                    highlightedProvinces.add(index);
                }
            });
            drawMap();
        }

        function resetView() {
            selectedProvince = null;
            highlightedProvinces.clear();
            document.getElementById('provinceInfo').style.display = 'none';
            drawMap();
        }

        // Drag and drop support
        const uploadArea = document.getElementById('uploadArea');
        
        uploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadArea.style.background = 'rgba(255,255,255,0.3)';
        });
        
        uploadArea.addEventListener('dragleave', () => {
            uploadArea.style.background = 'rgba(255,255,255,0.1)';
        });
        
        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadArea.style.background = 'rgba(255,255,255,0.1)';
            
            const file = e.dataTransfer.files[0];
            if (file) {
                const event = { target: { files: [file] } };
                loadGeoJSON(event);
            }
        });
    </script>
</body>
</html>
